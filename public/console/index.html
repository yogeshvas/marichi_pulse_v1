<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marichi Pulse Console</title>
  <link rel="icon" type="image/jpeg" href="/img/favicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">

<body class="console" data-mode="flight">
  <div id="root"><div class="login-wrap"><div class="card login-card"><h2>Loading Marichi Pulse…</h2>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/console/js/main.js"></script>
</body>
